<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Horas - MEI</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #111827;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 14px 12px 40px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-size: 18px;
    }

    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 16px;
    }

    .top-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .title {
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .subtitle {
      font-size: 1.08rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .clock {
      background: rgba(59, 130, 246, 0.16);
      color: #93c5fd;
      font-weight: 700;
      font-size: 2rem;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
    }

    .field {
      margin-bottom: 16px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      min-height: 64px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 21px;
      color: var(--text);
    }

    input::placeholder {
      font-size: 18px;
      color: var(--muted);
    }

    input:focus {
      outline: 2px solid var(--primary);
      border-color: var(--primary);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    button {
      min-height: 74px;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
      opacity: 0.92;
    }

    .btn-entrada { background: var(--success); }
    .btn-almoco-saida { background: var(--warning); color: #0f172a; }
    .btn-almoco-volta { background: var(--primary); }
    .btn-saida { background: var(--danger); }

    .status {
      margin-top: 14px;
      font-size: 1.1rem;
      line-height: 1.4;
      color: var(--muted);
      min-height: 26px;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    .slot {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
    }

    .slot span {
      display: block;
      font-size: 1.05rem;
      color: var(--muted);
    }

    .slot strong {
      display: block;
      font-size: 1.4rem;
      margin-top: 6px;
    }

    .totals {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .total-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .total-box span {
      font-size: 1.1rem;
      color: var(--muted);
      font-weight: 600;
    }

    .total-box strong {
      font-size: 1.5rem;
    }

    .horas-val { color: #38bdf8; }
    .money-val { color: var(--success); }

    @media (min-width: 768px) {
      .top-bar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      .clock {
        text-align: left;
        font-size: 1.45rem;
        padding: 12px 16px;
      }
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
      .actions {
        grid-template-columns: repeat(2, 1fr);
      }
      .totals {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 767px) {
      body {
        padding: 8px 6px 28px;
      }
      .app {
        max-width: 100%;
        gap: 12px;
      }
      .card {
        padding: 16px 14px;
        border-radius: 14px;
      }
      input {
        min-height: 66px;
        font-size: 22px;
      }
      button {
        min-height: 78px;
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card top-bar">
      <div>
        <div class="title">Controle de Horas - MEI</div>
        <div class="subtitle" id="data-hoje">Carregando data...</div>
      </div>
      <div class="clock" id="relogio">00:00:00</div>
    </section>

    <section class="card">
      <div class="field">
        <label for="prestador">Nome do Prestador (MEI) *</label>
        <input type="text" id="prestador" placeholder="Ex: Giovanny" oninput="carregarResumoPrestador(); salvarCampos();" />
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="servico">Local / Cliente</label>
          <input type="text" id="servico" placeholder="Ex: Indaial ou Fábrica Local" oninput="salvarCampos();" />
        </div>
        <div class="field">
          <label for="valor-hora">Valor da Hora (R$)</label>
          <input type="number" id="valor-hora" step="0.01" min="0" placeholder="Ex: 85.00" oninput="calcularTudo(); salvarCampos();" />
        </div>
      </div>
    </section>

    <section class="card">
      <div class="actions">
        <button class="btn-entrada" onclick="marcar('entrada')">Entrada</button>
        <button class="btn-almoco-saida" onclick="marcar('saidaAlmoco')">Saída Almoço</button>
        <button class="btn-almoco-volta" onclick="marcar('retornoAlmoco')">Retorno Almoço</button>
        <button class="btn-saida" onclick="marcar('saida')">Saída</button>
      </div>
      <div class="status" id="status">Preencha o nome do prestador e toque no botão correspondente.</div>
    </section>

    <section class="card">
      <div class="slots">
        <div class="slot"><span>Entrada</span><strong id="v-entrada">--:--</strong></div>
        <div class="slot"><span>Saída Almoço</span><strong id="v-saidaAlmoco">--:--</strong></div>
        <div class="slot"><span>Retorno Almoço</span><strong id="v-retornoAlmoco">--:--</strong></div>
        <div class="slot"><span>Saída</span><strong id="v-saida">--:--</strong></div>
      </div>

      <div class="totals">
        <div class="total-box">
          <span>Total Líquido</span>
          <strong class="horas-val" id="v-total">00h 00m</strong>
        </div>
        <div class="total-box">
          <span>Valor Estimado</span>
          <strong class="money-val" id="v-valor">R$ 0,00</strong>
        </div>
      </div>
    </section>
  </main>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwCHxo2FsL_DML9UxNeAhQUP98l-VSgok0-Z689Id0Np3WCyz0_0yXhun73LFmT6dN_xg/exec";

    const ROTULOS = {
      entrada: "Entrada",
      saidaAlmoco: "Saída Almoço",
      retornoAlmoco: "Retorno Almoço",
      saida: "Saída"
    };

    const CHAVE_CAMPOS = "mei_campos_registro_v1";
    let marcacoesAtuais = {};

    function hojeBR() {
      return new Date().toLocaleDateString("pt-BR");
    }

    function horaAtual() {
      return new Date().toTimeString().slice(0, 5);
    }

    function atualizarRelogio() {
      const agora = new Date();
      document.getElementById("relogio").textContent = agora.toLocaleTimeString("pt-BR");
      document.getElementById("data-hoje").textContent = agora.toLocaleDateString("pt-BR", {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
      });
    }

    function paraMin(h) {
      if (!h) return null;
      const [hh, mm] = h.split(":").map(Number);
      if (Number.isNaN(hh) || Number.isNaN(mm)) return null;
      return hh * 60 + mm;
    }

    function getChaveResumo(prestador) {
      return `resumo_${hojeBR()}_${prestador.trim().toLowerCase()}`;
    }

    function calcularMinutosLiquidos(dados) {
      let mins = 0;
      const e = paraMin(dados.entrada);
      const sa = paraMin(dados.saidaAlmoco);
      const ra = paraMin(dados.retornoAlmoco);
      const s = paraMin(dados.saida);

      if (e !== null && sa !== null && sa >= e) mins += (sa - e);
      if (ra !== null && s !== null && s >= ra) mins += (s - ra);
      if (e !== null && s !== null && sa === null && ra === null && s >= e) {
        mins = s - e;
      }
      return mins;
    }

    function formatarMoedaBRL(valor) {
      return valor.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function calcularTudo() {
      const dados = marcacoesAtuais || {};
      document.getElementById("v-entrada").textContent = dados.entrada || "--:--";
      document.getElementById("v-saidaAlmoco").textContent = dados.saidaAlmoco || "--:--";
      document.getElementById("v-retornoAlmoco").textContent = dados.retornoAlmoco || "--:--";
      document.getElementById("v-saida").textContent = dados.saida || "--:--";

      const mins = calcularMinutosLiquidos(dados);
      const hh = String(Math.floor(mins / 60)).padStart(2, "0");
      const mm = String(mins % 60).padStart(2, "0");
      document.getElementById("v-total").textContent = `${hh}h ${mm}m`;

      const valorHoraRaw = parseFloat(document.getElementById("valor-hora").value);
      const valorHora = Number.isFinite(valorHoraRaw) && valorHoraRaw > 0 ? valorHoraRaw : 0;
      const valorTotal = (mins / 60) * valorHora;
      document.getElementById("v-valor").textContent = formatarMoedaBRL(valorTotal);
    }

    function carregarResumoPrestador() {
      const prestador = document.getElementById("prestador").value.trim();
      if (!prestador) {
        marcacoesAtuais = {};
        calcularTudo();
        return;
      }
      marcacoesAtuais = JSON.parse(localStorage.getItem(getChaveResumo(prestador)) || "{}");
      calcularTudo();
    }

    function salvarCampos() {
      const dadosCampos = {
        prestador: document.getElementById("prestador").value,
        servico: document.getElementById("servico").value,
        valorHora: document.getElementById("valor-hora").value
      };
      localStorage.setItem(CHAVE_CAMPOS, JSON.stringify(dadosCampos));
    }

    function carregarCampos() {
      try {
        const salvo = JSON.parse(localStorage.getItem(CHAVE_CAMPOS) || "{}");
        if (salvo.prestador) document.getElementById("prestador").value = salvo.prestador;
        if (salvo.servico) document.getElementById("servico").value = salvo.servico;
        if (salvo.valorHora) document.getElementById("valor-hora").value = salvo.valorHora;
      } catch (e) {
        // Ignora erro de leitura local
      }
    }

    async function enviarParaPlanilha(payload, nomeEtapa, hora, prestador, statusEl) {
      if (!WEB_APP_URL || WEB_APP_URL.includes("COLE_AQUI")) {
        statusEl.textContent = `${nomeEtapa} registrada localmente às ${hora} (configure a WEB_APP_URL no código).`;
        return;
      }

      try {
        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        statusEl.textContent = `${nomeEtapa} enviada às ${hora} para ${prestador}!`;
      } catch (err) {
        statusEl.textContent = `Falha ao enviar (${hora}): ${err && err.message ? err.message : "verifique a conexão"}.`;
      }
    }

    function marcar(campo) {
      const prestador = document.getElementById("prestador").value.trim();
      const servico = document.getElementById("servico").value.trim() || "-";
      const valorHoraRaw = parseFloat(document.getElementById("valor-hora").value);
      const valorHora = Number.isFinite(valorHoraRaw) && valorHoraRaw > 0 ? valorHoraRaw : 0;
      const statusEl = document.getElementById("status");

      if (!prestador) {
        statusEl.textContent = "Digite o nome do prestador antes de registrar o horário.";
        document.getElementById("prestador").focus();
        return;
      }

      const chave = getChaveResumo(prestador);
      const dados = JSON.parse(localStorage.getItem(chave) || "{}");
      const hora = horaAtual();
      const nomeEtapa = ROTULOS[campo] || campo;

      if (dados[campo]) {
        const confirmar = confirm(
          `"${nomeEtapa}" já foi registrado hoje às ${dados[campo]} para ${prestador}. Deseja alterar para ${hora}?`
        );
        if (!confirmar) {
          statusEl.textContent = `Alteração cancelada. Mantido ${nomeEtapa} às ${dados[campo]}.`;
          return;
        }
      }

      dados[campo] = hora;
      localStorage.setItem(chave, JSON.stringify(dados));
      marcacoesAtuais = dados;
      calcularTudo();

      statusEl.textContent = `Enviando ${nomeEtapa} (${hora}) para a planilha...`;

      const minutosLiquidos = calcularMinutosLiquidos(dados);
      const horasDecimais = Number((minutosLiquidos / 60).toFixed(4));
      const valorEstimado = Number((horasDecimais * valorHora).toFixed(2));

      const payload = {
        data: hojeBR(),
        prestador,
        servico,
        valorHora,
        campo,
        hora,
        minutosLiquidos,
        horasDecimais,
        valorEstimado
      };

      if (window.google && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(() => {
            statusEl.textContent = `${nomeEtapa} salva na planilha às ${hora} para ${prestador}!`;
          })
          .withFailureHandler((err) => {
            statusEl.textContent = `Erro ao salvar na planilha (${hora}): ${err && err.message ? err.message : "verifique o script"}.`;
          })
          .registrarHoraWebApp(payload);
      } else {
        enviarParaPlanilha(payload, nomeEtapa, hora, prestador, statusEl);
      }
    }

    carregarCampos();
    atualizarRelogio();
    carregarResumoPrestador();
    setInterval(atualizarRelogio, 1000);
  </script>
</body>
</html>
